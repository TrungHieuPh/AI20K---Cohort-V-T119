<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hỏi đáp Bộ luật Lao động</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e4e4df; --accent:#1f5eff; --warn:#b54708; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --card:#1f1f1d; --ink:#ececea; --muted:#9a9a94; --line:#33332f; --accent:#7aa2ff; --warn:#f5a25d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:820px; margin:0 auto; padding:16px 16px 140px; }
  h1 { font-size:18px; margin:8px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .msg { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:10px 0; }
  .msg.user { background:transparent; border-style:dashed; }
  .msg .who { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .answer { white-space:pre-wrap; }
  .meta { font-size:12px; color:var(--muted); margin-top:8px; }
  .warn { color:var(--warn); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:999px; padding:2px 10px; font-size:12px; cursor:pointer; }
  .chip.cite { border-color:var(--accent); color:var(--accent); }
  details { margin-top:8px; font-size:13px; }
  details .art { border-top:1px solid var(--line); padding:6px 0; }
  details .art b { cursor:pointer; color:var(--accent); }
  form { position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line); padding:12px 16px; }
  form div { max-width:820px; margin:0 auto; display:flex; gap:8px; }
  textarea { flex:1; resize:none; height:56px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:inherit; }
  button { padding:0 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  dialog { max-width:760px; width:calc(100% - 32px); max-height:80vh; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); padding:16px; }
  dialog pre { white-space:pre-wrap; font:inherit; margin:0; }
</style>
</head>
<body>
<main>
  <h1>Hỏi đáp Bộ luật Lao động</h1>
  <div class="sub" id="sub">Chỉ trả lời dựa trên Bộ luật Lao động (VBHN 18/VBHN-VPQH). Bản thử nghiệm, không thay tư vấn pháp lý.</div>
  <div id="log"></div>
</main>
<form id="f">
  <div>
    <textarea id="q" placeholder="Ví dụ: Người lao động nghỉ việc phải báo trước bao nhiêu ngày? (Enter để gửi)"></textarea>
    <button id="send">Gửi</button>
  </div>
</form>
<dialog id="dlg"><pre id="dlgText"></pre><p><button onclick="dlg.close()">Đóng</button></p></dialog>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

fetch("/api/health").then(r => r.json()).then(h => {
  $("sub").textContent += ` · LLM: ${h.model}`;
}).catch(() => {});

function add(cls, html) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.innerHTML = html;
  $("log").appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "end" });
  return el;
}

async function moDieu(so) {
  $("dlgText").textContent = "Đang tải Điều " + so + "…";
  $("dlg").showModal();
  try {
    const r = await fetch("/api/dieu/" + so);
    const d = await r.json();
    $("dlgText").textContent = r.ok ? d.noi_dung : (d.detail || "Lỗi");
  } catch (e) { $("dlgText").textContent = "Lỗi: " + e; }
}
document.addEventListener("click", (e) => {
  const so = e.target.dataset && e.target.dataset.dieu;
  if (so) moDieu(so);
});

function render(d) {
  const cites = d.trich_dan.map(t => {
    const m = t.match(/Điều\s+(\d+)/i);
    return `<span class="chip cite" ${m ? `data-dieu="${m[1]}"` : ""}>${esc(t)}</span>`;
  }).join("");
  const arts = d.cac_dieu.map(a =>
    `<div class="art"><b data-dieu="${a.dieu}">Điều ${a.dieu}. ${esc(a.tieu_de)}</b> · score ${a.score}<br>${esc(a.trich)}</div>`
  ).join("");
  const ngoai = d.trich_dan_ngoai.length
    ? `<div class="meta warn">Trích Điều ${d.trich_dan_ngoai.join(", ")} không nằm trong các Điều đã truy hồi: cần kiểm lại.</div>` : "";
  const cost = d.chi_phi_usd != null ? ` · $${d.chi_phi_usd.toFixed(5)}` : "";
  return `<div class="who">Trợ lý</div>
    <div class="answer">${esc(d.cau_tra_loi)}</div>
    ${cites ? `<div class="chips">${cites}</div>` : ""}
    ${ngoai}
    <div class="meta">${d.thoi_gian_ms} ms${cost}${d.tu_choi ? " · không có căn cứ trong luật" : ""}</div>
    <details><summary>${d.cac_dieu.length} Điều đã truy hồi</summary>${arts}</details>`;
}

async function gui(e) {
  e && e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("q").value = "";
  $("send").disabled = true;
  add("user", `<div class="who">Bạn</div>${esc(q)}`);
  const cho = add("bot", `<div class="who">Trợ lý</div><span class="meta">Đang tra luật…</span>`);
  try {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ cau_hoi: q }) });
    const d = await r.json();
    cho.innerHTML = r.ok ? render(d) : `<div class="who">Lỗi</div><span class="warn">${esc(typeof d.detail === "string" ? d.detail : JSON.stringify(d.detail))}</span>`;
  } catch (err) {
    cho.innerHTML = `<div class="who">Lỗi</div><span class="warn">${esc(err)}</span>`;
  } finally {
    $("send").disabled = false;
    $("q").focus();
  }
}
$("f").addEventListener("submit", gui);
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) gui(e); });
</script>
</body>
</html>
